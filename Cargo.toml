[package]
name = "runir"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
ascii = "1.1.0"
async-stream = "0.3.6"
bitflags = "2.9.1"
bytes = "1.10.1"
crc = "3.3.0"
flexbuffers = "25.2.10"
futures = "0.3.31"
hex = "0.4.3"
memmap2 = "0.9.5"
scalable_cuckoo_filter = { version = "0.4.0", features = ["serde_support"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-queue"] }
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
time = "0.3.41"
tokio = { version = "1.45.1", features = ["full"] }
tokio-util = { version = "0.7.15", features = ["codec"] }
toml = "0.8.23"
tracing = "0.1.41"
tracing-test = "0.2.5"
unicode-segmentation = "1.12.0"
uuid = "1.17.0"
dashmap = "6.1.0"
parking_lot = "0.12.4"
nom = "8.0.0"
anyhow = "1.0.98"
