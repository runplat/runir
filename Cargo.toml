[package]
name = "runir"
version = "0.1.0"
edition = "2024"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]
cli = ["dep:serde_json", "dep:serde_yaml", "dep:clap"]

[dependencies]
ahash = "0.8.12"
ascii = "1.1.0"
async-stream = "0.3.6"
bitflags = "2.9.1"
bytes = "1.10.1"
crc = "3.3.0"
flexbuffers = "25.2.10"
futures = "0.3.31"
hex = "0.4.3"
crossbeam = { version = "0.8.4", features = ["crossbeam-queue"] }
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
time = "0.3.41"
toml = "0.8.23"
tracing = "0.1.41"
tracing-test = "0.2.5"
unicode-segmentation = "1.12.0"
uuid = "1.17.0"
dashmap = { version = "6.1.0", features = ["rayon"] }
asynchronous-codec = "0.7.0"
parking_lot = "0.12.4"
stackfuture = "0.3.0"
tracing-subscriber = "0.3.19"
pin-project-lite = "0.2.16"
async-compat = "0.2.4"
memmap2 = "0.9.5"
anyhow = "1.0.98"
zstd = "0.13.3"
generic-array = "1.2.0"
either = "1.15.0"
thiserror = "2.0.12"
rayon = "1.10.0"

tokio = { version = "1.45.1", features = ["full"], optional = true }
clap =  { version = "4.5.40", features = ["derive", "env"], optional = true }
serde_json = { version = "1.0.140", optional = true }
serde_yaml = { version = "0.9.34", optional = true }

[[bin]]
name = "runir"
required-features = ["cli"]
